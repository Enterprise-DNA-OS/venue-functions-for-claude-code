name: Venue checks
# Manual only since 2026-10-18 to save GitHub Actions minutes (Sam). To restore, put back:
# on: [push, pull_request]
on: [workflow_dispatch]
jobs:
  embedded:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: venue
          POSTGRES_PASSWORD: venue_test_only
          POSTGRES_DB: venue_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://venue:venue_test_only@localhost:5432/venue_test?sslmode=disable
